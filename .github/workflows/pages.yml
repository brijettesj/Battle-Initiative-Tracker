# Publishes www/ to GitHub Pages on every push to main.
#
# Inert until Pages is switched on for the repository: Settings, then Pages,
# then set Source to "GitHub Actions". Until then this workflow simply never
# has anywhere to deploy to.
#
# The install button in the app only appears on a real hosted origin, because
# browsers require a manifest and a service worker served as actual files over
# HTTPS. That is what this gives you.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build www/
        run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
