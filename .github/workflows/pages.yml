# Publishes www/ to GitHub Pages on every push to main.
#
# Pages is switched on for this repository with its source set to GitHub
# Actions, and the site is at https://brijettesj.github.io/Battle-Initiative-Tracker/
#
# It was not always. Before it was enabled this workflow did not sit quietly:
# configure-pages asks the API for the Pages site, gets a 404, and fails the
# job, so every push to main sent a failure notification. If Pages is ever
# turned off again, expect the same. Either turn it back on or give this
# workflow a `workflow_dispatch`-only trigger; there is no state in which it
# both runs and does nothing.
#
# The install button in the app only appears on a real hosted origin, because
# browsers require a manifest and a service worker served as actual files over
# HTTPS. That is what this gives you.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build www/
        run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
